name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f4-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The F4 comparison only
        run: npm exec -w packages/daemon -- vitest run test/f4-1191-compare.test.ts --reporter=verbose
